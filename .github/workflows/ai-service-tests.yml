name: ai-service tests (Atul — tracking/geolocation)

on:
  push:
    branches: [feature/ai-geolocation, develop, main]
    paths:
      - "apps/ai-service/**"
      - ".github/workflows/ai-service-tests.yml"
  pull_request:
    paths:
      - "apps/ai-service/**"
      - ".github/workflows/ai-service-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -v

      - name: Independent demo (CLI)
        run: python geolocate.py --telemetry tests/fixtures/sample_telemetry.json --detections tests/fixtures/mock_detections.json
