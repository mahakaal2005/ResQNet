name: api tests (Rudra — intelligence)

on:
  push:
    branches: [feature/intelligence, develop, main]
    paths:
      - "apps/api/**"
      - "database/migrations/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "database/migrations/**"
      - ".github/workflows/api-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Pin npm to match the committed lockfile's generator
        run: npm install -g npm@11.8.0 # avoids npm-major-version drift causing false "lockfile out of sync" failures

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

      - name: Integration tests (Testcontainers)
        run: npm run demo:intelligence
