# Owner: Charan (Section 3, secondary ownership: local Docker Compose bootstrap
# for the whole team).
#
# The Section 3 independent demo, in three commands:
#
#   docker compose up -d db api
#   docker compose run --rm seed
#   curl -s localhost:3000/auth/login -H 'content-type: application/json' \
#     -d '{"email":"operator@resqnet.demo","password":"resqnet-demo"}'
#
# No other service has to be running. See docs/api/openapi.yaml for the full
# request collection.

name: resqnet

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: resqnet
      POSTGRES_PASSWORD: resqnet
      POSTGRES_DB: resqnet
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Postgres runs every .sql here in filename order on an empty data
      # directory: 0001 (Rudra, intelligence tables) then 0002 (Charan, core
      # tables). Shared database, separate ownership — Section 11.
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqnet -d resqnet"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: resqnet
      DB_PASSWORD: resqnet
      DB_NAME: resqnet
      # The migrations above are the schema of record; never let TypeORM
      # reshape a schema another owner also writes to.
      DB_SYNCHRONIZE: "false"
      # Override in any environment that is not a laptop demo.
      JWT_SECRET: ${JWT_SECRET:-resqnet-dev-secret-change-me}
      PORT: "3000"
    ports:
      - "3000:3000"

  # One-shot: `docker compose run --rm seed`. Idempotent, so it doubles as the
  # "reset the demo" command between rehearsal runs.
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: resqnet
      DB_PASSWORD: resqnet
      DB_NAME: resqnet
    command: ["node", "database/seeds/seed.mjs"]
    restart: "no"

volumes:
  db_data:
