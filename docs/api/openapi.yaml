# ResQNet API (owners: Charan — backend core; Rudra — intelligence)
#
# One deployable REST API. It includes Charan's auth, missions, operators,
# sectors and audit endpoints, alongside Rudra's AI ingest and incident
# endpoints. Chirag's /realtime WebSocket namespace is described by
# packages/contracts/telemetry.schema.json.
openapi: 3.1.0

info:
  title: ResQNet Backend Core API
  version: 1.0.0
  description: |
    Mission, sector, operator, auth and audit endpoints for the ResQNet
    command platform (Smart India Hackathon Phase 1, software-first).

    **Bootstrap**

    ```
    docker compose up -d db api
    docker compose run --rm seed
    ```

    Seeded accounts all share the password `resqnet-demo`:

    | email | role | may |
    |---|---|---|
    | admin@resqnet.demo | admin | everything, plus user management |
    | operator@resqnet.demo | operator | create missions/sectors, change mission status |
    | viewer@resqnet.demo | viewer | read only |

servers:
  - url: http://localhost:3000
    description: Local Docker Compose demo

tags:
  - name: auth
    description: JWT issuance and refresh
  - name: missions
    description: Mission lifecycle; publishes mission.started / paused / completed
  - name: sectors
    description: Search-sector assignment
  - name: operators
    description: The signed-in account
  - name: audit
    description: Operator action trail

  - name: intelligence
    description: Public AI-service ingest for detections and geolocation results
  - name: incidents
    description: Authenticated incident dashboard and operator actions
security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Exchange operator credentials for a token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  {
                    type: string,
                    format: email,
                    example: operator@resqnet.demo,
                  }
                password: { type: string, example: resqnet-demo }
      responses:
        "200":
          description: Token pair issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: Unknown email or wrong password (indistinguishable by design)

  /auth/refresh:
    post:
      tags: [auth]
      summary: Trade a refresh token for a fresh pair
      description: |
        The users row is re-read rather than trusting the token's claims, so a
        role change or a deleted account takes effect on the next refresh. An
        access token is rejected here.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: Token invalid, expired, of the wrong type, or its account is gone

  /operators/me:
    get:
      tags: [operators]
      summary: The signed-in operator and the permissions their role holds
      description: |
        Returns the permission list, not just the role, so the dashboard can
        hide controls the caller cannot use without duplicating the role matrix
        client-side.
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operator" }
        "401": { description: Missing or invalid access token }

  /missions:
    post:
      tags: [missions]
      summary: Create a mission and assign its search sectors
      description: |
        Demo steps 1–2 of Section 27. The zone is split into `sector_count`
        equal strips along its longer axis, so a new mission always arrives
        with a usable sector layout. The mission starts in `created`; nothing
        flies until it is moved to `active`.

        Requires `mission:create` (operator or admin).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMission" }
      responses:
        "201":
          description: Mission created, with its generated sectors
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Mission"
                  - type: object
                    properties:
                      sectors:
                        type: array
                        items: { $ref: "#/components/schemas/Sector" }
        "400":
          {
            description: Malformed zone polygon,
            sector_count out of range,
            or duplicate mission_id,
          }
        "403": { description: Role lacks mission:create }
    get:
      tags: [missions]
      summary: List missions, newest first
      responses:
        "200":
          description: Missions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Mission" }

  /missions/{id}:
    get:
      tags: [missions]
      summary: Fetch one mission
      parameters:
        - $ref: "#/components/parameters/MissionId"
      responses:
        "200":
          description: The mission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mission" }
        "404": { description: No such mission }

  /missions/{id}/status:
    patch:
      tags: [missions]
      summary: Drive the mission state machine
      description: |
        Allowed edges, and the Section 10.6 event each publishes:

        | from → to | event |
        |---|---|
        | created → active | `mission.started` |
        | paused → active | `mission.started` |
        | active → paused | `mission.paused` |
        | active/paused → completed | `mission.completed` |

        `completed` is terminal. Chirag's gateway starts and stops simulated
        drone motion on these events, so an invalid transition is rejected
        before anything is published.

        Requires `mission:update-status`.
      parameters:
        - $ref: "#/components/parameters/MissionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [created, active, paused, completed]
      responses:
        "200":
          description: Updated mission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mission" }
        "400": { description: Transition not allowed from the current status }
        "403": { description: Role lacks mission:update-status }
        "404": { description: No such mission }

  /missions/{id}/sectors:
    get:
      tags: [sectors]
      summary: Sectors of a mission, ordered SECTOR-A first
      parameters:
        - $ref: "#/components/parameters/MissionId"
      responses:
        "200":
          description: Sectors
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Sector" }
        "404": { description: No such mission }

  /sectors:
    post:
      tags: [sectors]
      summary: Create or replace one sector definition
      description: |
        Upsert on `(mission_id, sector_id)`. Mission creation has already
        claimed SECTOR-A..N with generated strips, so pinning an exact polygon
        — the layout `apps/simulator/src/sectors.ts` flies, for instance — or
        assigning a drone overwrites the generated strip rather than colliding
        with it.

        The polygon must lie inside the mission zone. Requires `sector:create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSector" }
      responses:
        "201":
          description: The stored sector
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sector" }
        "400":
          {
            description: Malformed polygon,
            polygon outside the mission zone,
            or bad sector_id,
          }
        "403": { description: Role lacks sector:create }
        "404": { description: No such mission }

  /audit-logs:
    get:
      tags: [audit]
      summary: Operator action trail, newest first
      description: |
        A read-only, non-blocking consumer (Section 3). Mission actions, sector
        assignment, auth events and — when the intelligence modules are running
        — incident lifecycle events all land here. Logins are not
        mission-scoped, so they appear only in the unfiltered log.

        A rejected request writes nothing: a 400 or a 403 leaves no audit row.

        Writing a row never fails the action that produced it, so treat this as
        a near-complete trail rather than a transactional ledger.
      parameters:
        - name: mission_id
          in: query
          required: false
          schema: { type: string, example: MISSION-DEMO-1 }
          description: External mission_id. Omit for the whole log.
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 200, minimum: 1 }
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLogEntry" }
        "403": { description: Role lacks audit:read }

  /detections:
    post:
      tags: [intelligence]
      summary: Ingest one AI survivor detection
      description: Public machine-to-machine ingest. A duplicate `detection_id` is rejected.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DetectionInput" }
      responses:
        "201":
          description: Detection stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Detection" }
        "400": { description: Invalid detection payload }
        "409": { description: detection_id was already ingested }

  /geolocations:
    post:
      tags: [intelligence]
      summary: Ingest a detection geolocation and create or update its incident
      description: Public machine-to-machine ingest. The referenced detection must already exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeolocationInput" }
      responses:
        "201":
          description: Geolocation stored and intelligence pipeline processed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeolocationIntakeResult" }
        "400": { description: Invalid geolocation payload }
        "404": { description: Referenced detection_id was not found }

  /incidents:
    get:
      tags: [incidents]
      summary: List incidents by descending priority
      description: Requires `incident:read` (viewer, operator, or admin).
      responses:
        "200":
          description: Incidents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Incident" }
        "401": { description: Missing or invalid access token }
        "403": { description: Role lacks incident:read }

  /incidents/{id}:
    get:
      tags: [incidents]
      summary: Fetch one incident
      description: Requires `incident:read`.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Incident
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "401": { description: Missing or invalid access token }
        "403": { description: Role lacks incident:read }
        "404": { description: No such incident }

  /incidents/{id}/status:
    patch:
      tags: [incidents]
      summary: Confirm, dispatch, or resolve an incident
      description: |
        Requires `incident:update-status` (operator or admin). Valid state
        transitions are `open → confirmed → dispatched → resolved`; an
        optional `distress_flag` change recalculates priority.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIncidentStatus" }
      responses:
        "200":
          description: Updated incident
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "400": { description: Invalid payload or state transition }
        "401": { description: Missing or invalid access token }
        "403": { description: Role lacks incident:update-status }
        "404": { description: No such incident }

  /incidents/{id}/priority-breakdown:
    get:
      tags: [incidents]
      summary: Fetch the latest transparent priority-score breakdown
      description: Requires `incident:read`.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Priority breakdown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriorityBreakdown" }
        "401": { description: Missing or invalid access token }
        "403": { description: Role lacks incident:read }
        "404": { description: No score or incident exists for this id }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The `access_token` from /auth/login. Refresh tokens are rejected here.

  parameters:
    MissionId:
      name: id
      in: path
      required: true
      description: The mission's uuid or its external mission_id (`MISSION-DEMO-1`). Either resolves.
      schema: { type: string }
      example: MISSION-DEMO-1

    IncidentId:
      name: id
      in: path
      required: true
      description: External incident identifier (for example, `INC-A21ADCDC`).
      schema: { type: string, pattern: "^INC-[A-F0-9]+$" }
  schemas:
    GeoJsonPolygon:
      type: object
      description: GeoJSON Polygon, SRID 4326, single closed exterior ring, coordinates as [lon, lat].
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon] }
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items: { type: number }
              minItems: 2
              maxItems: 2
      example:
        type: Polygon
        coordinates:
          [
            [
              [77.20, 28.610],
              [77.22, 28.610],
              [77.22, 28.620],
              [77.20, 28.620],
              [77.20, 28.610],
            ],
          ]

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in:
          { type: string, example: 15m, description: Access-token lifetime. }
        user: { $ref: "#/components/schemas/AuthenticatedUser" }

    AuthenticatedUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, operator, viewer] }

    Operator:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        role: { type: string, enum: [admin, operator, viewer] }
        permissions:
          type: array
          items:
            type: string
            enum:
              - mission:create
              - mission:read
              - mission:update-status
              - sector:create
              - sector:read
              - audit:read
              - incident:read
              - incident:update-status
              - operator:read-self
              - user:manage
        created_at: { type: string, format: date-time }

    CreateMission:
      type: object
      required: [name, zone_polygon, sector_count]
      properties:
        name:
          {
            type: string,
            maxLength: 120,
            example: Yamuna Flood Plain — Demo Sweep,
          }
        zone_polygon: { $ref: "#/components/schemas/GeoJsonPolygon" }
        sector_count:
          type: integer
          minimum: 1
          maximum: 26
          description: Capped at 26 — the SECTOR-[A-Z] ceiling the frozen telemetry contract imposes.
          example: 3
        mission_id:
          type: string
          pattern: "^MISSION-[A-Z0-9-]+$"
          description: Optional. Generated when omitted; the seed pins MISSION-DEMO-1.

    Mission:
      type: object
      properties:
        id: { type: string, format: uuid, description: Surrogate key. }
        mission_id:
          type: string
          description: External identifier every other service puts on the wire.
          example: MISSION-DEMO-1
        name: { type: string }
        status: { type: string, enum: [created, active, paused, completed] }
        zone_polygon: { $ref: '#/components/schemas/GeoJsonPolygon' }
        sector_count: { type: integer }
        created_by: { type: [string, 'null'], format: uuid }
        started_at:
          type: [string, 'null']
          format: date-time
          description: Set on the first activation only — the PRD Section 15 metric measures from mission start, not from the last resume.
        completed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        zonePolygon: { $ref: "#/components/schemas/GeoJsonPolygon" }
        sectorCount: { type: integer }
        createdBy: { type: [string, "null"], format: uuid }
        startedAt:
          type: [string, "null"]
          format: date-time
          description: Set on the first activation only — the PRD Section 15 metric measures from mission start, not from the last resume.
        completedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateSector:
      type: object
      required: [mission_id, sector_id, polygon]
      properties:
        mission_id:
          {
            type: string,
            description: The mission's uuid or its external mission_id.,
          }
        sector_id:
          type: string
          pattern: "^SECTOR-[A-Z]$"
          example: SECTOR-A
        polygon: { $ref: "#/components/schemas/GeoJsonPolygon" }
        assigned_drone_id:
          type: string
          pattern: "^DRONE-[0-9]{2}$"
          description: Plain identifier, not a foreign key — the drones table belongs to Chirag and may not exist when this service runs alone.
          example: DRONE-01

    Sector:
      type: object
      properties:
        id: { type: string, format: uuid }
        mission_id: { type: string, example: MISSION-DEMO-1 }
        sector_id: { type: string, example: SECTOR-A }
        polygon: { $ref: '#/components/schemas/GeoJsonPolygon' }
        assigned_drone_id: { type: [string, 'null'], example: DRONE-01 }
        created_at: { type: string, format: date-time }
        missionId: { type: string, example: MISSION-DEMO-1 }
        sectorId: { type: string, example: SECTOR-A }
        polygon: { $ref: "#/components/schemas/GeoJsonPolygon" }
        assignedDroneId: { type: [string, "null"], example: DRONE-01 }
        createdAt: { type: string, format: date-time }

    PixelPoint:
      type: object
      required: [x, y]
      properties:
        x: { type: number }
        y: { type: number }

    BoundingBox:
      type: object
      required: [x, y, w, h]
      properties:
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }

    DetectionInput:
      type: object
      required:
        [
          detection_id,
          drone_id,
          sector_id,
          timestamp,
          bbox,
          confidence,
          centroid,
        ]
      properties:
        detection_id: { type: string, example: DET-01 }
        drone_id: { type: string, example: DRONE-01 }
        sector_id: { type: string, example: SECTOR-A }
        timestamp: { type: string, format: date-time }
        bbox: { $ref: "#/components/schemas/BoundingBox" }
        confidence: { type: number, minimum: 0, maximum: 1, example: 0.87 }
        centroid: { $ref: "#/components/schemas/PixelPoint" }

    Detection:
      type: object
      required:
        [
          id,
          detectionId,
          droneId,
          sectorId,
          timestamp,
          bbox,
          confidence,
          centroid,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        detectionId: { type: string, example: DET-01 }
        droneId: { type: string, example: DRONE-01 }
        sectorId: { type: string, example: SECTOR-A }
        timestamp: { type: string, format: date-time }
        bbox: { $ref: "#/components/schemas/BoundingBox" }
        confidence: { type: number, minimum: 0, maximum: 1, example: 0.87 }
        centroid: { $ref: "#/components/schemas/PixelPoint" }
        createdAt: { type: string, format: date-time }

    GeolocationInput:
      type: object
      required: [detection_id, latitude, longitude, error_m, method]
      properties:
        detection_id: { type: string, example: DET-01 }
        latitude: { type: number, minimum: -90, maximum: 90, example: 28.6142 }
        longitude:
          { type: number, minimum: -180, maximum: 180, example: 77.2093 }
        error_m: { type: number, minimum: 0, example: 4.2 }
        method: { type: string, example: flat_ground_photogrammetric }

    Geolocation:
      type: object
      required:
        [
          id,
          detectionId,
          latitude,
          longitude,
          errorM,
          method,
          location,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        detectionId: { type: string, example: DET-01 }
        latitude: { type: number, example: 28.6142 }
        longitude: { type: number, example: 77.2093 }
        errorM: { type: number, minimum: 0, example: 4.2 }
        method: { type: string, example: flat_ground_photogrammetric }
        location: { $ref: "#/components/schemas/GeoJsonPoint" }
        createdAt: { type: string, format: date-time }

    GeolocationIntakeResult:
      type: object
      required: [geolocation, incident]
      properties:
        geolocation: { $ref: "#/components/schemas/Geolocation" }
        incident: { $ref: "#/components/schemas/Incident" }

    GeoJsonPoint:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Point] }
        coordinates:
          type: array
          items: { type: number }
          minItems: 2
          maxItems: 2

    IncidentEvidence:
      type: object
      required: [frame_ref, detection_id]
      properties:
        frame_ref: { type: string, example: DET-01 }
        detection_id: { type: string, example: DET-01 }

    Incident:
      type: object
      required:
        [
          id,
          incidentId,
          latitude,
          longitude,
          survivorCountEstimate,
          confidence,
          priorityScore,
          status,
          firstSeen,
          lastSeen,
          evidence,
          sourceDrones,
          sectorId,
          operatorConfirmed,
          distressFlag,
        ]
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, example: INC-A21ADCDC }
        latitude: { type: number, example: 28.61423 }
        longitude: { type: number, example: 77.20934 }
        location: { $ref: "#/components/schemas/GeoJsonPoint" }
        survivorCountEstimate: { type: integer, minimum: 1, example: 2 }
        confidence: { type: number, minimum: 0, maximum: 1, example: 0.91 }
        priorityScore: { type: integer, minimum: 0, maximum: 90, example: 31 }
        status: { type: string, enum: [open, confirmed, dispatched, resolved] }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/IncidentEvidence" }
        sourceDrones:
          type: array
          items: { type: string }
        sectorId: { type: string, example: SECTOR-A }
        operatorConfirmed: { type: boolean }
        distressFlag: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UpdateIncidentStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [open, confirmed, dispatched, resolved] }
        distress_flag: { type: boolean }

    PriorityBreakdown:
      type: object
      required: [people_count, isolation, time_factor, distress_flag, total]
      properties:
        people_count: { type: integer, minimum: 0, maximum: 30 }
        isolation: { type: integer, minimum: 0, maximum: 20 }
        time_factor: { type: integer, minimum: 0, maximum: 20 }
        distress_flag: { type: integer, minimum: 0, maximum: 20 }
        total: { type: integer, minimum: 0, maximum: 90 }
    AuditLogEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        mission_id:
          type: [string, 'null']
          description: Null for actions that are not mission-scoped, such as a login.
        actor_user_id:
          type: [string, 'null']
        missionId:
          type: [string, "null"]
          description: Null for actions that are not mission-scoped, such as a login.
        actorUserId:
          type: [string, "null"]
          format: uuid
          description: Null when the system itself is the actor.
        action:
          type: string
          example: mission.started
          description: |
            `auth.login`, `auth.login_failed`, `mission.created`,
            `mission.started`, `mission.paused`, `mission.completed`,
            `sector.assigned`, `sector.created`, `sector.updated`, and
            `incident.*` when the intelligence modules run. Full vocabulary and
            per-action payload keys: `docs/contracts/audit-log.md`.
        entity_type: { type: [string, 'null'], example: mission }
        entity_id: { type: [string, 'null'], example: MISSION-DEMO-1 }
          description: "auth.login, auth.login_failed, mission.created, mission.started, mission.paused, mission.completed, and incident.* when the intelligence modules run."
        entityType: { type: [string, "null"], example: mission }
        entityId: { type: [string, "null"], example: MISSION-DEMO-1 }
        payload: { type: object, additionalProperties: true }
        timestamp: { type: string, format: date-time }
